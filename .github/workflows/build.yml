# This workflow will do a clean installation of Bun dependencies, build the source code and run tests
# For more information see: https://github.com/oven-sh/setup-bun

name: Bun CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest # Or a specific version like 1.1.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # - name: Test
      #   run: bun test
